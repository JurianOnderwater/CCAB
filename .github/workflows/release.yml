name: Release Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: dist/CCAB-Studio-macos-*.zip
          - os: windows-latest
            artifact_glob: dist/CCAB-Studio-windows-*.exe
          - os: ubuntu-latest
            artifact_glob: dist/ccab-studio-linux-*

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[static-ffmpeg]" pyinstaller

      - name: Build executable
        run: python scripts/build_executable.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccab-studio-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
